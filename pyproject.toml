[project]
name = "agent-ui-server"
version = "0.1.0"
description = "Mobile-first web UI for controlling Claude Code agent sessions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "inotify-simple>=1.3.5",
    "pathspec>=0.12.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
agent-ui-server = "agent_ui_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ui_server"]
